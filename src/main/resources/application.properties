# ===============================
# Application & Server Config
# ===============================
spring.application.name=api-camping
server.port=8083
server.servlet.context-path=/api
server.forward-headers-strategy=framework

# ===============================
# Spring Cloud Config
# ===============================
spring.cloud.config.import-check.enabled=false
spring.cloud.config.fail-fast=false

# ===============================
# Database Configuration (PostgreSQL in Docker)
# ===============================
spring.datasource.url=jdbc:postgresql://postgres-camping:5432/campconnect_camping
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# ===============================
# Message Broker (RabbitMQ in Docker)
# ===============================
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===============================
# Eureka Discovery Client (in Docker)
# ===============================
eureka.client.service-url.defaultZone=http://eureka:8761/eureka
eureka.client.register-with-eureka=true

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ===============================
# Security & 3rd Party Integrations
# ===============================
